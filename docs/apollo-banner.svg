<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-label="Apollo API Health Monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FA"/>
      <stop offset="0.45" stop-color="#E6EDF2"/>
      <stop offset="1" stop-color="#D5E4EC"/>
    </linearGradient>
    <linearGradient id="glow" x1="180" y1="40" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="860" y1="90" x2="1180" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#2D4A6E" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="220" fill="url(#glow)"/>
  <circle cx="1080" cy="360" r="200" fill="url(#glow)" opacity="0.7"/>

  <!-- orbit mark -->
  <g transform="translate(980 240)">
    <circle r="92" stroke="url(#orbit)" stroke-width="3" fill="none" opacity="0.9"/>
    <ellipse rx="68" ry="28" stroke="#0F766E" stroke-width="2.5" fill="none" transform="rotate(-28)" opacity="0.85"/>
    <circle r="18" fill="#0F766E"/>
    <circle cx="62" cy="-34" r="6" fill="#2D4A6E"/>
  </g>

  <text x="88" y="168" fill="#12151A" font-family="Syne, Arial Black, sans-serif" font-size="96" font-weight="800" letter-spacing="-4">Apollo</text>
  <text x="92" y="230" fill="#3D4550" font-family="Outfit, Segoe UI, sans-serif" font-size="34" font-weight="500">API Health Monitor</text>
  <text x="92" y="286" fill="#6B7380" font-family="Outfit, Segoe UI, sans-serif" font-size="22">Uptime · Incidents · Alerts · Public status</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#0F766E">
    <rect x="92" y="330" width="168" height="42" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-opacity="0.28"/>
    <text x="112" y="357">Django + React</text>
    <rect x="276" y="330" width="148" height="42" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-opacity="0.28"/>
    <text x="296" y="357">Docker ready</text>
    <rect x="440" y="330" width="170" height="42" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-opacity="0.28"/>
    <text x="460" y="357">Postgres / SQLite</text>
  </g>
</svg>
