services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      APOLLO_SEED_ON_STARTUP: "${APOLLO_SEED_ON_STARTUP:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    volumes:
      - apollo_data:/data
    restart: unless-stopped

volumes:
  apollo_data:
