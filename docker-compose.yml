services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo -d apollo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://apollo:apollo@db:5432/apollo
      APOLLO_SEED_ON_STARTUP: "${APOLLO_SEED_ON_STARTUP:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-60}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["/worker.sh"]
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://apollo:apollo@db:5432/apollo
      APOLLO_SEED_ON_STARTUP: "false"
      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-60}"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
